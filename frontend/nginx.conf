http {
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=1g inactive=60m use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}

server {
    listen 80;
    server_name _;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    root /usr/share/nginx/html;
    index index.html;

    # 1. СТАТИКА (МЕДИА)
    location ^~ /media/ {
        alias /var/www/media/;
        expires max;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 2. ПРОКСИРОВАНИЕ НА БЭКЕНД (GRANIAN) С ЗАЩИТОЙ
    location /api/ {
        # Лимит: 5 запросов в сек., всплеск до 10
        limit_req zone=api_limit burst=10 nodelay;

        # Кэширование: использует зону 'my_cache' (настроенную в http блоке)
        proxy_cache my_cache;
        proxy_cache_valid 200 302 1m;
        proxy_cache_valid 404 10s;
        add_header X-Cache-Status $upstream_cache_status;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://unix:/tmp/sockets/granian.sock;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
    }

    # 3. СТАТИЧЕСКИЕ АССЕТЫ (CSS/JS/IMAGES)
    location ~* \.(?:css|js|mjs|map|ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires max;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 4. РОУТИНГ SPA (REACT)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
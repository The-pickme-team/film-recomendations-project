# ВАЖНО: Весь контекст должен быть внутри блока http
http {
    # 1. Общие настройки типов и логов
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Ваши зоны лимитов и кэша
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=1g inactive=60m use_temp_path=off;

    # 2. Блок сервера внутри http
    server {
        listen 80;
        server_name _;

        # Базовые оптимизации
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        root /usr/share/nginx/html;
        index index.html;

        # СТАТИКА (МЕДИА)
        location ^~ /media/ {
            alias /var/www/media/;
            expires max;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # ПРОКСИРОВАНИЕ НА БЭКЕНД
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_cache my_cache;
            proxy_cache_valid 200 302 1m;
            proxy_cache_valid 404 10s;
            add_header X-Cache-Status $upstream_cache_status;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://unix:/tmp/sockets/granian.sock;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # СТАТИЧЕСКИЕ АССЕТЫ
        location ~* \.(?:css|js|mjs|map|ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
            try_files $uri =404;
            expires max;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # РОУТИНГ SPA (REACT)
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}
# Блок events обязателен для Nginx, добавьте его в самый верх файла
events {
    worker_connections 1024;
}
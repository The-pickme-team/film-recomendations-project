app: 
  openapi:
    title: "My API"
    version: "1.0.0"
    description: "This is the API documentation for My API."
  cors:
    allowed_origins:
      - "http://localhost:3000"
      - "https://myapp.com"
    allowed_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
    allowed_headers:
      - "Content-Type"
      - "Authorization"
database:
  url:
    driver: "asyncpg"
    username: "user"
    password: ""
    host: "postgres"
    port: 5432
    database: "database"
  pool_size: 20
  max_overflow: 30
logging:
  level: "INFO"